<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Treaded – Interaktiver Pfad</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #181c27;
      --border: #252a38;
      --accent: #5b7fff;
      --accent-glow: rgba(91, 127, 255, 0.18);
      --text: #e8eaf0;
      --muted: #6b7280;
      --font: 'Inter', system-ui, sans-serif;
    }

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Layout ── */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      height: 60px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-icon {
      width: 30px;
      height: 30px;
      background: var(--accent);
      border-radius: 8px;
      display: grid;
      place-items: center;
      box-shadow: 0 0 14px var(--accent-glow);
    }

    .logo-icon svg {
      width: 16px; height: 16px; fill: #fff;
    }

    .logo-text {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .3px;
      color: var(--text);
    }

    .badge {
      font-size: 11px;
      font-weight: 500;
      color: var(--accent);
      background: var(--accent-glow);
      border: 1px solid rgba(91,127,255,.3);
      padding: 3px 9px;
      border-radius: 20px;
      letter-spacing: .4px;
      text-transform: uppercase;
    }

    /* ── Main content ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 28px;
      gap: 20px;
    }

    .info-bar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .info-bar h1 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e88;
      animation: pulse 2s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .55; transform: scale(1.3); }
    }

    /* ── iframe card ── */
    .frame-card {
      flex: 1;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 4px 40px rgba(0,0,0,.5);
      background: var(--surface);
      min-height: 500px;
      position: relative;
    }

    .frame-card iframe {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 660px;
      border: 0;
    }

    /* ── Footer ── */
    footer {
      padding: 14px 28px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      main { padding: 14px; }
      header { padding: 0 16px; }
      .info-bar h1 { font-size: 15px; }
    }
  </style>
</head>
<body>
<div class="page">

  <header>
    <a class="logo" href="#">
      <div class="logo-icon">
        <!-- simple path/route icon -->
        <svg viewBox="0 0 16 16"><path d="M2 13c0-.55.45-1 1-1h2.5V8H4a1 1 0 0 1 0-2h2.5V4a1 1 0 0 1 1-1h3a1 1 0 1 1 0 2H8.5v2H11a1 1 0 1 1 0 2H8.5v4H13a1 1 0 1 1 0 2H3a1 1 0 0 1-1-1Z"/></svg>
      </div>
      <span class="logo-text">Treaded</span>
    </a>
    <span class="badge">Live</span>
  </header>

  <main>
    <div class="info-bar">

        allow="microphone; camera; autoplay"

  <footer>Bereitgestellt via Treaded · Eingebettete Ansicht</footer>

</div>
</body>
</html>
