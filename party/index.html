<!--
  ============================================================
  WLW+ Karteikarten-Baustein — heller WLW-Stil
  ------------------------------------------------------------
  EINBETTUNG INS CMS (an der gewünschten Stelle der Seite):
    1. Den kompletten <style>-Block „WLW+ BAUSTEIN“ kopieren
    2. Das <div class="wlwpk" id="wlwp-karteikarten" v-pre></div> kopieren
    3. Den <script>-Block am Ende des <body> kopieren
  Alle Styles sind mit .wlwpk gescoped und fassen das
  umgebende Seitendesign nicht an.
  · SCHLANK (≈ 0,3 MB Skript): PDF.js v6 wird zur Laufzeit von
    cdn.jsdelivr.net geladen (2 Dateien, vom Browser gecacht).
    Zum Selbst-Hosten: beide .mjs-Dateien auf den eigenen Server
    legen und im Skript PDFJS_BASE anpassen.
  · WICHTIG: Die Karteikarten-PDFs brauchen sauber eingebettete
    Schriften. Word-Exporte einmalig reparieren (Ghostscript,
    »gs -sDEVICE=pdfwrite«) oder als PDF/A exportieren — sonst
    fehlen auf iOS die fetten Überschriften.
  · VUE: Die App ist im Skript gekapselt und schreibt nichts ins
    globale window-Objekt — kein Konflikt mit Vue. Das v-pre am
    Wurzel-Element hält Vue vom Bereich fern; erscheint der
    Container erst später, hängt sich der Baustein selbst ein.
  · MOBIL: Frage/Antwort-Label stehen über der Karte; Schriften
    werden als Vektorpfade gezeichnet — fette Überschriften
    erscheinen auf iOS identisch zum Desktop.
  · BREITE: --wlwpk-max richtet den Baustein an der Navigation aus.
    HÖHE DER KARTE: --wlwpk-cardh (Desktop 62vh, mobil 78vh).
  · DSGVO: PDFs verlassen das Gerät der Nutzer NICHT — sie werden
    lokal im Browser gerendert; der Lernfortschritt liegt im
    localStorage. Einzige externe Verbindung: das Laden von
    PDF.js (jsdelivr, keine Nutzerdaten).
  · Der Google-Fonts-Link unten dient NUR diesem Standalone-Preview
    und entfällt beim Einbetten (die Seite lädt Inter bereits).
  ============================================================
-->

/* Schrift wie auf der WLW+-Landingpage (Inter); ist Inter auf der Seite

    :where(.wlwpk h1, .wlwpk h2, .wlwpk h3, .wlwpk p, .wlwpk ul, .wlwpk figure) { margin: 0; padding: 0; }

    /* Ausbruch aus der CMS-Inhaltsspalte: der Baustein richtet sich an der
       Breite der Navigationsleiste aus. --wlwpk-max bei Bedarf an die
       exakte Nav-Container-Breite anpassen. Sollte eine horizontale
       Scrollleiste erscheinen: auf dem Seiten-Wrapper overflow-x:clip setzen. */
