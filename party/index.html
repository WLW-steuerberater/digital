  body{background:linear-gradient(180deg,var(--grad-top),var(--grad-bot)) fixed;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
  input,textarea{font-family:inherit;user-select:text;-webkit-user-select:text}
  @keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @keyframes sheetIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes sheetDown{to{transform:translateY(105%)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes dimOut{to{opacity:0}}
  @keyframes popIn{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
  @keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes shakeX{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
  .riseIn{animation:riseIn .3s cubic-bezier(.22,1,.36,1) both}
  .popIn{animation:popIn .34s cubic-bezier(.34,1.56,.64,1) both}
  .shakeX{animation:shakeX .38s cubic-bezier(.36,.07,.19,.97) both}
  .vgroup .vsubs{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.22,1,.36,1)}
  .vgroup.open .vsubs{grid-template-rows:1fr}
  .vgroup .vsubs>div{overflow:hidden;min-height:0}
  .vgroup .chev{display:inline-block;transition:transform .35s cubic-bezier(.22,1,.36,1)}
  .vgroup.open .chev{transform:rotate(180deg)}
  .press{transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s, filter .18s;cursor:pointer;will-change:transform}
  .press:active,.press.pressing{transform:scale(.96);filter:brightness(.97);transition-duration:.05s}
  .btn3d{transition:transform .18s cubic-bezier(.34,1.56,.64,1);cursor:pointer;will-change:transform}
  .btn3d:active,.btn3d.pressing{transform:translateY(3px) scale(.99);transition-duration:.05s}
  .dCard.pressing{transform:scale(.98)}
  .dStat.pressing{transform:scale(.96)}


  /* ---------- App shell (the 2a mobile app) ---------- */
  #appShell{position:relative;height:100dvh;display:flex;flex-direction:column;background:var(--bg-app);overflow:hidden}
  #screen{flex:1;position:relative;overflow:hidden}
  .layer{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--bg-app)}
  /* Desktop: app shell becomes a centered phone-like card for inner screens */
  @media (min-width:768px) and (hover:hover) and (pointer:fine){
    #appShell{width:430px;height:min(880px,calc(100vh - 48px));margin:24px auto;border-radius:34px;box-shadow:0 24px 60px rgba(30,45,110,.35);border:1px solid rgba(255,255,255,.35)}

  }
  @media (max-width:767.98px), (hover:none), (pointer:coarse){
    #deskHome{display:none !important}
  }
  body:not(.deskHome) #deskHome{display:none}
  @media (min-width:768px) and (hover:hover) and (pointer:fine){
    body.deskHome{overflow:auto}
    body.deskHome #deskHome{display:block}
  }

  /* ---------- Floating glass tab bar ---------- */
  #tabbar{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:0 16px calc(12px + env(safe-area-inset-bottom));pointer-events:none}
  @media (min-width:768px) and (hover:hover) and (pointer:fine){#tabbar{padding-bottom:16px}}

  #tabbar .blob{position:absolute;top:6px;height:56px;width:60px;border-radius:999px;background:rgba(63,135,230,.13);box-shadow:inset 0 0 0 1px rgba(63,135,230,.08);opacity:0;transition:left .42s cubic-bezier(.3,1.25,.4,1), width .3s cubic-bezier(.3,1.25,.4,1), background .2s, opacity .25s}
  #tabbar .pill.dragging .blob{transition:background .2s;width:74px;background:rgba(63,135,230,.19)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:100%;cursor:pointer;position:relative;z-index:1;color:#8a93ab;transition:color .2s}
  .tab svg{width:24px;height:24px;display:block;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
  .tab .lb{font-size:9.5px;font-weight:700;line-height:1;letter-spacing:.01em}
  .tab.active,.tab.hot{color:var(--blue)}
  .tab.active svg,.tab.hot svg{transform:scale(1.06)}

  /* ---------- Sticky sub-headers on gradient screens ---------- */
  .gradScreen{padding-bottom:110px;background:linear-gradient(180deg,var(--grad-top),var(--grad-bot));min-height:100%;box-sizing:border-box}
  .subHead{position:sticky;top:0;z-index:5;background:rgba(122,178,255,.93);backdrop-filter:blur(12px);padding:20px 16px 10px;border-bottom:1px solid rgba(255,255,255,.14)}

  .backBtn{color:#fff;font-size:15px;font-weight:600;cursor:pointer;padding:6px 10px 6px 0}
  .backBtn:active{opacity:.5}

  /* ---------- Bottom sheet ---------- */
  #sheetWrap{position:absolute;inset:0;z-index:30}
  #sheetWrap .dim{position:absolute;inset:0;background:rgba(42,51,80,.42);animation:fadeIn .32s ease-out}
  #sheetWrap .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:26px 26px 0 0;padding:10px 20px calc(30px + env(safe-area-inset-bottom));animation:sheetUp .48s cubic-bezier(.2,.9,.2,1);will-change:transform;touch-action:none;box-shadow:0 -12px 40px rgba(25,45,100,.18)}
  #sheetWrap .sheet .si{animation:sheetIn .42s cubic-bezier(.22,1,.36,1) both}
  #sheetWrap.closing .sheet{animation:sheetDown .26s cubic-bezier(.5,0,.75,0) forwards}
  #sheetWrap.closing .dim{animation:dimOut .26s ease forwards}
  @media (min-width:768px) and (hover:hover) and (pointer:fine){#sheetWrap .sheet{border-radius:24px 24px 33px 33px}}

  .dTitle{display:flex;align-items:center;justify-content:center;gap:9px;font-size:22px;font-weight:800;color:#fff;text-shadow:0 1px 4px rgba(40,55,120,.25)}
  .dRingWrap{display:flex;justify-content:center;margin:26px 0 34px}
  .ring{position:relative;display:flex;align-items:center;justify-content:center}
  .ring::before{content:'';position:absolute;inset:0;border-radius:999px;background:var(--ring);
    -webkit-mask:radial-gradient(closest-side,transparent calc(var(--hole) - 1.5%),#000 var(--hole));
    mask:radial-gradient(closest-side,transparent calc(var(--hole) - 1.5%),#000 var(--hole))}
  .dRing{width:172px;height:172px;--hole:86%}
  .dRingIn{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
  .dRingIn .pct{font-size:34px;font-weight:800;line-height:1}
  .dRingIn .cap{font-size:11px;font-weight:700;letter-spacing:.12em;opacity:.85;margin-top:5px}
  .dStats{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:44px}
  .dStat{background:#fff;border-radius:16px;box-shadow:0 4px 14px rgba(35,50,120,.16);padding:16px 22px;display:flex;align-items:center;gap:13px;min-width:180px;box-sizing:border-box;cursor:pointer;transition:transform .12s}

  .dStat .ic{font-size:30px;line-height:1}
  .dStat .k{font-size:11px;font-weight:700;letter-spacing:.07em;color:#5a6478;text-transform:uppercase}
  .dStat .v{font-size:21px;font-weight:800;color:#1c2433;line-height:1.15}
  .dStat .v small{font-size:13px;font-weight:600;color:#6b7686}

  .dStatCom .k{color:rgba(255,255,255,.85)}
  .dStatCom .v{color:#fff;font-size:24px}
  .dGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:26px;max-width:1340px;margin:0 auto}
  .dCard{border-radius:20px;padding:22px 22px 26px;cursor:pointer;transition:transform .15s, box-shadow .15s;box-shadow:0 4px 14px rgba(35,50,120,.10)}
  .dCard:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(35,50,120,.22)}
  .dCard img{width:100%;aspect-ratio:248/260;object-fit:cover;border-radius:10px;display:block;box-shadow:0 2px 8px rgba(35,50,120,.18)}
  .dCard .tile{width:100%;aspect-ratio:248/260;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:84px;box-shadow:0 2px 8px rgba(35,50,120,.12)}
  .dCard h3{font-family:Georgia,'Times New Roman',serif;font-size:24px;font-weight:700;color:#1f2a44;margin:20px 0 10px;line-height:1.2}
  .dCard p{font-family:Georgia,'Times New Roman',serif;font-size:15px;color:#2c3652;margin:0;line-height:1.45}
  .dCardGhost h3,.dCardGhost p{color:#fff}

  ::-webkit-scrollbar{width:0;height:0}
</style>
</head>

  const el=document.getElementById('deskHome');
  const ringPct=gesamtPct();
  const cards=DESK_CARDS.map((c,i)=>`

      <div class="dStat dStatCom" onclick="App.goTab('community')"><div class="ic">👥</div><div><div class="k">Community</div><div class="v">Rangliste</div></div></div>

}

/* =============== Mobile screens (2a) =============== */
function scrFaecher(){
  const cards=FAECHER.map((f,i)=>{
    const pct=fachPct(i), started=pct>0;
    const cardBg=f.img?'#b1f5a3':'#fff';
    const track=f.img?'rgba(255,255,255,0.55)':'#e9edf9';
    const pctColor=started?(f.img?'#2c6b1f':GS):'#a9b2c9';
    const bar=started?(f.img?'#3e8f2d':G):'#c9d2ea';
    return `
    <div class="press" onclick="App.openFach(${i})" style="background:${cardBg};border-radius:18px;padding:15px 17px;box-shadow:0 2px 6px rgba(60,80,160,.08)">
      <div style="display:flex;align-items:center;gap:13px">
        ${f.img?`<div style="width:52px;height:52px;flex:none;border-radius:13px;overflow:hidden;background-image:url(${f.img});background-size:cover;background-position:center"></div>`
               :`<div style="width:44px;height:44px;border-radius:13px;background:${f.tint};display:flex;align-items:center;justify-content:center;font-size:21px;flex:none">${f.icon}</div>`}
        <div style="flex:1;min-width:0;font-size:15.5px;font-weight:700;color:var(--ink)">${esc(f.name)}</div>
        <div style="font-size:13px;font-weight:800;color:${pctColor};flex:none">${pct}%</div>
      </div>
      <div style="height:6px;background:${track};border-radius:3px;overflow:hidden;margin-top:11px"><div style="height:100%;width:${pct}%;background:${bar};border-radius:3px;transition:width .4s"></div></div>
    </div>`;
  }).join('');
  return `
  <div class="fade" style="padding-bottom:110px">
    <div style="background:linear-gradient(180deg,#6facff,#9cc6ff);padding:calc(24px + env(safe-area-inset-top)) 20px 22px;border-radius:0 0 26px 26px">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="font-size:14px;color:rgba(255,255,255,.85)">Guten Morgen, ${esc(S.charName)}</div>
        <div class="press" onclick="App.goTab('streak')" style="display:flex;align-items:center;gap:5px;background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:800;color:#e8862a">🔥 ${S.streak}</div>
      </div>
      <div style="display:flex;align-items:center;gap:16px;margin-top:14px">
        <div class="ring" style="width:72px;height:72px;--hole:81%;--ring:conic-gradient(#fff ${gesamtPct()}%, rgba(255,255,255,.3) 0);flex:none">
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff">
            <div style="font-size:16px;font-weight:800;line-height:1">${gesamtPct()}%</div>
            <div style="font-size:8.5px;font-weight:700;letter-spacing:.08em;opacity:.8;margin-top:2px">GESAMT</div>
          </div>
        </div>
        <div style="font-size:20px;font-weight:800;color:#fff;line-height:1.3">🌱 Blutiger Anfänger</div>
      </div>
    </div>
    <div style="padding:16px 18px 0;display:flex;flex-direction:column;gap:11px">${cards}</div>
  </div>`;
}

function scrPfad(){
  const fach=FAECHER[S.fachIdx];
  let nodeIdx=0;
  const nodes=fach.themes.map((t,i)=>{
    const off=Math.round(Math.sin(nodeIdx*1.15)*66);
    if(t.badge){
      nodeIdx++;
      const bBg=t.locked?'#dfe4f5':'linear-gradient(135deg,#f5cf5a,#e8a13a)';
      const bShadow=t.locked?'0 5px 0 #c5cde8':'0 5px 0 #b97f22';
      const bTag=t.locked?'rgba(255,255,255,.65)':'#ffe08a';
      const bFilter=t.locked?'grayscale(1) opacity(.6)':'none';
      const icon=t.bigIcon||t.icon, bSize=t.bigIcon?'15px':'24px';
      return `
      <div style="display:flex;justify-content:center;padding:12px 0 74px;transform:translateX(${off}px)">
        <div style="position:relative">
          <div style="width:56px;height:56px;transform:rotate(45deg);border-radius:17px;background:${bBg};box-shadow:${bShadow};display:flex;align-items:center;justify-content:center;margin:4px">
            <div style="transform:rotate(-45deg);font-size:${bSize};white-space:nowrap;filter:${bFilter}">${icon}</div>
          </div>
          ${t.locked?`<div style="position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:999px;background:#fff;box-shadow:0 2px 6px rgba(60,80,160,.2);display:flex;align-items:center;justify-content:center;font-size:12px">🔒</div>`:''}
          <div style="position:absolute;top:70px;left:50%;transform:translateX(-50%);text-align:center;width:200px">
            <div style="font-size:10px;font-weight:800;letter-spacing:.06em;color:${bTag};text-transform:uppercase">Badge</div>
            <div style="font-size:11.5px;font-weight:800;color:#fff">${esc(t.title)}</div>
            <div style="font-size:10.5px;color:rgba(255,255,255,.8);line-height:1.35;margin-top:2px">${esc(t.sub)}</div>
          </div>
        </div>
      </div>`;
    }
    nodeIdx++;
    const done=t.st==='done';
    const num=fach.themes.slice(0,i+1).filter(x=>!x.badge).length;
    return `
    <div style="display:flex;justify-content:center;padding:11px 0 22px;transform:translateX(${off}px)">
      <div style="position:relative">
        <div class="btn3d" onclick="App.openTheme(${i})" style="width:64px;height:64px;border-radius:999px;background:${done?G:'#fff'};box-shadow:${done?'0 5px 0 '+GS:'0 5px 0 #c9d3f0'};display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:${done?'#fff':fach.color}">${done?'✓':num}</div>
        <div style="position:absolute;top:68px;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:700;color:#fff;white-space:nowrap;text-shadow:0 1px 3px rgba(40,55,120,.25)">${esc(t.label)}</div>
      </div>
    </div>`;
  }).join('');
  const pct=fachPct(S.fachIdx);
  return `
  <div class="gradScreen">
    <div class="subHead">
      <div style="display:flex;align-items:center">
        <div class="backBtn" onclick="App.backToFaecher()">‹ Fächer</div>
        <div style="flex:1;text-align:center;font-size:15.5px;font-weight:700;color:#fff;margin-right:62px">${esc(FAECHER[S.fachIdx].name)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:4px">
        <div style="flex:1;height:5px;background:rgba(255,255,255,.3);border-radius:3px;overflow:hidden"><div style="height:100%;width:${pct}%;background:#8fe07a;border-radius:3px"></div></div>
        <div style="font-size:12px;font-weight:800;color:#fff">${pct}%</div>
      </div>
    </div>
    <div style="padding-top:16px">${nodes}</div>
  </div>`;
}

function videoTheme(){ const f=FAECHER[S.fachIdx]; return f.themes[S.vTheme]||f.themes[0]; }
function videoList(vt){ return vt.vids||['Einführung ins Thema','Grundbegriffe & Definitionen','Vertiefung & Beispiele']; }
function videoItems(vt){
  const items=[];
  videoList(vt).forEach((v,i)=>{
    if(typeof v==='string') items.push({id:String(i),label:String(i+1),title:v,group:null});
    else v.subs.forEach((s,j)=>items.push({id:i+'.'+j,label:(i+1)+'.'+(j+1),title:s,group:i}));
  });
  return items;
}
function videoDone(vt){
  const key=S.fachIdx+'-'+S.vTheme;
  if(S.vmap[key]) return S.vmap[key];
  const d={};
  if(vt.st==='done') videoItems(vt).forEach(it=>d[it.id]=true);
  else if(vt.vinit) Object.assign(d,vt.vinit);
  return d;
}
function scrVideos(){
  const vt=videoTheme();
  const list=videoList(vt);
  const items=videoItems(vt);
  const done=videoDone(vt);
  const key=S.fachIdx+'-'+S.vTheme;
  if(!items.some(it=>it.id===S.vid)) S.vid=items[0].id;
  const curItem=items.find(it=>it.id===S.vid);
  const paras=vt.paras||[];
  const shown=S.parasOpen?paras:paras.slice(0,4);
  const row=(it,sub)=>{
    const d=!!done[it.id], cur=it.id===S.vid;
    return `
    <div class="press" onclick="App.pickVid('${it.id}')" style="display:flex;align-items:center;gap:12px;${sub?'padding:11px 14px 11px 18px;border-top:1px solid #edf1fa;':'border:2px solid '+(d?G:(cur?B:'#e5e9f6'))+';border-radius:13px;padding:11px 14px;'}background:${d?G:(sub&&cur?'#ecf4ff':'#fff')}">
      <div style="min-width:${sub?'36px':'26px'};height:26px;padding:0 6px;border-radius:8px;background:${d?'rgba(255,255,255,.25)':(cur?'#e4f0ff':'#f0f2fa')};color:${d?'#fff':(cur?B:'#a9b2c9')};display:flex;align-items:center;justify-content:center;font-size:${sub?'11px':'12px'};font-weight:800;flex:none">${it.label}</div>
      <div style="flex:1;font-size:13.5px;font-weight:700;color:${d?'#fff':(cur?'var(--ink)':'#8a94b0')};line-height:1.3">${esc(it.title)}</div>
      <div style="font-size:14px;font-weight:800;color:${d?'#fff':(cur?B:'#c3cad9')};flex:none">${d?'✓':'▶'}</div>
    </div>`;
  };
  const rows=list.map((v,i)=>{
    if(typeof v==='string') return row(items.find(it=>it.id===String(i)),false);
    const subs=items.filter(it=>it.group===i);
    const nDone=subs.filter(it=>done[it.id]).length, all=nDone===subs.length;
    const hasCur=subs.some(it=>it.id===S.vid);
    const open=hasCur||!!(S.vopen[key]&&S.vopen[key][i]);
    return `
    <div id="vg${i}" class="vgroup ${open?'open':''}" style="border:2px solid ${all?G:(hasCur?B:'#e5e9f6')};border-radius:13px;background:#fff;overflow:hidden">
      <div class="press" onclick="App.toggleGroup(${i})" style="display:flex;align-items:center;gap:12px;padding:11px 14px;background:${all?G:'#fff'}">
        <div style="width:26px;height:26px;border-radius:8px;background:${all?'rgba(255,255,255,.25)':(hasCur?'#e4f0ff':'#f0f2fa')};color:${all?'#fff':(hasCur?B:'#a9b2c9')};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none">${i+1}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13.5px;font-weight:700;color:${all?'#fff':(hasCur?'var(--ink)':'#5d6785')};line-height:1.3">${esc(v.t)}</div>
          <div style="font-size:11px;font-weight:700;color:${all?'rgba(255,255,255,.8)':'#a9b2c9'};margin-top:2px">${subs.length} Videos · ${nDone}/${subs.length} gesehen</div>
        </div>
        <div class="chev" style="font-size:13px;color:${all?'#fff':'#a9b2c9'};flex:none">▾</div>
      </div>
      <div class="vsubs"><div>${subs.map(it=>row(it,true)).join('')}</div></div>
    </div>`;
  }).join('');
  return `
  <div class="gradScreen">
    <div class="subHead"><div style="display:flex;align-items:center">
      <div class="backBtn" onclick="App.toPfad()">‹ Lernpfad</div>
      <div style="flex:1;text-align:center;font-size:15.5px;font-weight:700;color:#fff;margin-right:72px">🎬 Lernvideos</div>
    </div></div>
    <div style="padding:14px 18px 0">
      <div style="font-size:12px;font-weight:800;letter-spacing:.05em;color:#fff;text-transform:uppercase;margin-bottom:10px;text-shadow:0 1px 3px rgba(40,55,120,.25)">${esc(vt.t)}</div>
      <div style="background:#fff;border-radius:18px;box-shadow:0 2px 8px rgba(60,80,160,.1);overflow:hidden">
        <div style="height:168px;background:#e4f0ff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">
          <div class="press" style="width:54px;height:54px;border-radius:999px;background:${B};display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;box-shadow:0 4px 12px rgba(63,135,230,.4)">▶</div>
          <div style="font-size:12px;color:#7d88ad">Video abspielen</div>
        </div>
        <div style="padding:13px 16px;display:flex;align-items:center;gap:10px">
          <div style="background:#e4f0ff;color:${B};font-size:11px;font-weight:800;border-radius:7px;padding:4px 8px;flex:none">Video ${curItem.label}</div>
          <div style="font-size:15px;font-weight:800;color:var(--ink);line-height:1.3">${esc(curItem.title)}</div>
        </div>
      </div>
      ${paras.length?`
      <div style="margin-top:12px;background:#fff;border-radius:15px;padding:13px 15px;box-shadow:0 2px 6px rgba(60,80,160,.08)">
        <div style="font-size:11px;font-weight:800;letter-spacing:.05em;color:#8a94b0;text-transform:uppercase;margin-bottom:9px">Paragraphen-Markierungen</div>
        <div style="display:flex;flex-wrap:wrap;gap:7px">
          ${shown.map(p=>`<div class="press" style="background:${B};color:#fff;font-size:11.5px;font-weight:800;border-radius:8px;padding:6px 11px">${esc(p)}</div>`).join('')}
          ${paras.length>4?`<div class="press" onclick="App.toggleParas()" style="background:#e4f0ff;color:${B};font-size:11.5px;font-weight:800;border-radius:8px;padding:6px 11px">${S.parasOpen?'weniger':'+'+(paras.length-4)+' weitere'}</div>`:''}
        </div>
      </div>`:''}
      <div class="btn3d" onclick="App.nextVideo()" style="margin:12px auto 0;width:fit-content;background:${B};color:#fff;border-radius:12px;padding:11px 22px;font-size:14px;font-weight:800;box-shadow:0 4px 0 ${'#2f6ac2'}">Nächstes Video →</div>
      <div style="font-size:14.5px;font-weight:800;color:#fff;margin:20px 0 10px;text-shadow:0 1px 3px rgba(40,55,120,.25)">Alle Videos</div>
      <div style="display:flex;flex-direction:column;gap:8px">${rows}</div>
      <div class="btn3d" onclick="App.toLK()" style="margin-top:16px;background:${G};color:#fff;border-radius:14px;padding:14px;text-align:center;font-size:15px;font-weight:800;box-shadow:0 4px 0 ${GS}">Zur Lernkontrolle →</div>
    </div>
  </div>`;
}

function scrLK(){
  const running=S.lkI<LK_QS.length;
  const q=LK_QS[Math.min(S.lkI,LK_QS.length-1)];
  const answered=S.lkPicked!==null;
  const ok=answered&&S.lkPicked===q.ok;
  let inner='';
  if(running){
    const opts=q.opts.map((text,i)=>{
      let border='#e5e9f6',bg='#fff',color='var(--ink)',anim='';
      if(answered&&i===q.ok){border=G;bg='#eef8ea';color='#3f8a32';anim=' popIn';}
      else if(answered&&i===S.lkPicked&&i!==q.ok){border='#d64545';bg='#fdeaea';color='#a32e2e';anim=' shakeX';}
      return `<div class="press${anim}" onclick="App.lkPick(${i})" style="border:2px solid ${border};background:${bg};border-radius:14px;padding:13px 15px;font-size:14px;font-weight:700;color:${color};text-align:center">${esc(text)}</div>`;
    }).join('');
    inner=`
    <div style="margin:14px 16px 0;background:#fff;border-radius:18px;padding:16px;box-shadow:0 2px 8px rgba(60,80,160,.1)">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div style="background:${B};color:#fff;font-size:12px;font-weight:800;border-radius:999px;padding:5px 12px">Aufgabe ${Math.min(S.lkI+1,LK_QS.length)}</div>
        <div style="font-size:11.5px;font-weight:700;color:#8a94b0">${esc(q.type)}</div>
      </div>
      <div style="font-size:12px;font-weight:700;color:#8a94b0;margin-bottom:4px">${esc(q.topic)}</div>
      <div style="font-size:16.5px;font-weight:800;color:var(--ink);line-height:1.35">${esc(q.q)}</div>
      ${q.scenario?`<div style="margin-top:10px;background:#ecf4ff;border-radius:13px;padding:12px 14px;font-size:13.5px;color:#3a4570;line-height:1.5;font-weight:600">${esc(q.scenario)}</div>`:''}
      <div style="display:flex;flex-direction:column;gap:9px;margin-top:14px">${opts}</div>
      ${answered?`<div class="riseIn" style="margin-top:12px;background:${ok?'#eef8ea':'#fdeaea'};border-radius:14px;padding:13px 15px">
        <div style="font-size:14px;font-weight:800;color:${ok?GS:'#d64545'}">${ok?'Richtig!':'Nicht ganz.'}</div>
        <div style="font-size:13px;color:#4a5568;margin-top:3px;line-height:1.45">${esc(q.fb)}</div></div>`:''}
    </div>
    ${answered?`<div class="btn3d riseIn" onclick="App.lkNext()" style="animation-delay:.08s;margin:14px 16px 0;background:${B};color:#fff;border-radius:14px;padding:14px;text-align:center;font-size:15px;font-weight:800;box-shadow:0 4px 0 #2f6ac2">${S.lkI===LK_QS.length-1?'Ergebnis anzeigen':'Nächste Aufgabe →'}</div>`:''}`;
  } else {
    inner=`
    <div style="margin:20px 16px 0;background:#fff;border-radius:20px;padding:26px 20px;text-align:center;box-shadow:0 2px 8px rgba(60,80,160,.1)">
      <div class="popIn" style="font-size:46px">🎉</div>
      <div class="riseIn" style="font-size:21px;font-weight:800;color:var(--ink);margin-top:8px;animation-delay:.1s">Geschafft!</div>
      <div class="riseIn" style="font-size:14px;color:#7d88ad;margin-top:4px;animation-delay:.16s">${S.lkScore} von ${LK_QS.length} Aufgaben richtig</div>
      <div class="popIn" style="display:inline-block;background:#eef8ea;color:${GS};border-radius:999px;padding:6px 16px;font-size:13px;font-weight:800;margin-top:12px;animation-delay:.3s">⚡ +${S.lkScore*20} XP</div>
    </div>
    <div class="btn3d" onclick="App.lkToCase()" style="margin:14px 16px 0;background:${G};color:#fff;border-radius:14px;padding:14px;text-align:center;font-size:15px;font-weight:800;box-shadow:0 4px 0 ${GS}">Zum Übungsfall →</div>
    <div class="press" onclick="App.toPfad()" style="margin:10px 16px 0;background:#fff;color:${B};border:2px solid #dde3f5;border-radius:14px;padding:13px;text-align:center;font-size:14.5px;font-weight:800">Zurück zum Lernpfad</div>`;
  }
  const pct=Math.round(((S.lkI+(answered?1:0))/LK_QS.length)*100);
  return `
  <div class="gradScreen">
    <div class="subHead">
      <div style="display:flex;align-items:center">
        <div class="backBtn" onclick="App.toPfad()">‹ Lernpfad</div>
        <div style="flex:1;text-align:center;font-size:15.5px;font-weight:700;color:#fff;margin-right:72px">📝 Lernkontrolle</div>
      </div>
      ${running?`<div style="display:flex;align-items:center;gap:10px;margin-top:4px">
        <div style="flex:1;height:5px;background:rgba(255,255,255,.3);border-radius:3px;overflow:hidden"><div style="height:100%;width:${pct}%;background:#8fe07a;border-radius:3px;transition:width .4s"></div></div>
        <div style="font-size:12px;font-weight:800;color:#fff;white-space:nowrap">${Math.min(S.lkI+1,LK_QS.length)} / ${LK_QS.length}</div>
      </div>`:''}
    </div>
    ${inner}
  </div>`;
}

function scrUF(){
  const list=S.ufCase===null;
  let inner='';
  if(list){
    inner=`<div style="padding:14px 16px 0;display:flex;flex-direction:column;gap:9px">
      ${UF_CASES.map((title,i)=>`
      <div class="press" onclick="App.ufOpen(${i})" style="display:flex;align-items:center;gap:12px;background:#fff;border-radius:15px;padding:13px 15px;box-shadow:0 2px 8px rgba(40,55,120,.15)">

const HOME_URL='https://wlw-steuern.de/e-learning';
const TAB_DEFS=[{id:'home',label:'Home'},{id:'community',label:'Community'},{id:'lernen',label:'Lernen'},{id:'badges',label:'Badges'},{id:'streak',label:'Streak'}];
const activeTabId=()=> S.tab==='lernen' ? 'lernen' : S.tab;
const BLOB_W=60;
let _tabsBuilt=false;
function renderTabbar(){
  const bar=document.getElementById('tabbar');
  if(!_tabsBuilt){
    bar.innerHTML=`<div class="pill">
      <div class="blob" id="tabBlob"></div>
      ${TAB_DEFS.map(t=>`<div class="tab" data-tab="${t.id}">${TAB_ICONS[t.id]()}<div class="lb">${t.label}</div></div>`).join('')}
    </div>`;
    _tabsBuilt=true;
    attachTabDrag(bar.querySelector('.pill'), document.getElementById('tabBlob'));
  }
  const activeId=activeTabId();
  bar.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===activeId));
  const blob=document.getElementById('tabBlob');
  const act=bar.querySelector(`.tab[data-tab="${activeId}"]`);
  if(act&&act.offsetWidth){
    const left=act.offsetLeft+(act.offsetWidth-BLOB_W)/2;
    if(blob.style.opacity!=='1'){
      blob.style.transition='none';
      blob.style.left=left+'px';
      blob.style.opacity='1';
      requestAnimationFrame(()=>{blob.style.transition='';});
    } else {
      blob.style.left=left+'px';
    }
  }
}
function tabActivate(id, viaDrag){
  if(id==='home'){ window.open(HOME_URL,'_blank','noopener'); renderTabbar(); return; }
  if(id===activeTabId()){ renderTabbar(); return; }
  if(viaDrag) hapt();
  if(id==='lernen') App.goHome(); else App.goTab(id);
}
function attachTabDrag(pill, blob){
  let down=false, dragging=false, sx=0, tapTarget=null;
  const tabs=()=>[...pill.querySelectorAll('.tab')];
  const nearest=x=>{ let best=null,bd=1e9; tabs().forEach(t=>{ const c=t.offsetLeft+t.offsetWidth/2, d=Math.abs(c-x); if(d<bd){bd=d;best=t;} }); return best; };
  pill.addEventListener('pointerdown',e=>{
    down=true; dragging=false; sx=e.clientX;
    tapTarget=(e.target.closest&&e.target.closest('.tab'))||nearest(e.clientX-pill.getBoundingClientRect().left);
    try{ pill.setPointerCapture(e.pointerId); }catch(_){}
  });
  pill.addEventListener('pointermove',e=>{
    if(!down) return;
    const x=e.clientX-pill.getBoundingClientRect().left;
    if(!dragging){ if(Math.abs(e.clientX-sx)<5) return; dragging=true; pill.classList.add('dragging'); }
    const w=74, left=Math.max(4, Math.min(pill.clientWidth-w-4, x-w/2));
    blob.style.left=left+'px';
    const n=nearest(x);
    tabs().forEach(t=>t.classList.toggle('hot',t===n));
  });
  const up=e=>{
    if(!down) return; down=false;
    const x=e.clientX-pill.getBoundingClientRect().left;
    const target=dragging ? nearest(x) : tapTarget;
    const wasDrag=dragging; dragging=false;
    tabs().forEach(t=>t.classList.remove('hot'));
    pill.classList.remove('dragging');
    if(!target){ renderTabbar(); return; }
    tabActivate(target.dataset.tab, wasDrag);
  };
  pill.addEventListener('pointerup',up);
  pill.addEventListener('pointercancel',up);
}

  host.innerHTML=`
  <div id="sheetWrap">
    <div class="dim" onclick="App.closeSheet()"></div>
    <div class="sheet">
      <div style="width:38px;height:5px;border-radius:3px;background:#dde3f5;margin:0 auto 14px"></div>
      <div class="si" style="animation-delay:.08s;font-size:11.5px;font-weight:800;letter-spacing:.06em;color:${B};text-transform:uppercase">Thema ${num}</div>
      <div class="si" style="animation-delay:.11s;font-size:19px;font-weight:800;color:var(--ink);margin:4px 0 16px;line-height:1.3">${esc(t.t)}</div>
      <div style="display:flex;flex-direction:column;gap:9px">
        ${units.map((u,i)=>{
          const st=states[i];
          return `<div class="press si" onclick="${u.tap}" style="animation-delay:${.16+i*.05}s;display:flex;align-items:center;gap:13px;border:2px solid ${st==='done'?'#cfe9c8':'#e5e9f6'};background:${st==='done'?'#eef8ea':'#fff'};border-radius:15px;padding:13px 15px">
            <div style="font-size:20px;flex:none">${u.icon}</div>
            <div style="flex:1;font-size:14.5px;font-weight:700;color:var(--ink)">${u.name}</div>
            <div style="font-size:13px;font-weight:800;color:${st==='done'?GS:B};flex:none">${st==='done'?'✓':'›'}</div>
          </div>`;}).join('')}
      </div>
    </div>
  </div>`;
  attachSheetDrag();
}
function attachSheetDrag(){
  const wrap=document.getElementById('sheetWrap');
  if(!wrap) return;
  const sheet=wrap.querySelector('.sheet');
  let startY=null,dy=0;
  const move=e=>{
    if(startY===null) return;
    dy=Math.max(0,(e.touches?e.touches[0].clientY:e.clientY)-startY);
    sheet.style.transition='none';
    sheet.style.transform=`translateY(${dy}px)`;
  };
  const end=()=>{
    if(startY===null) return;
    startY=null;
    if(dy>90){ App.closeSheet(); }
    else{
      sheet.style.transition='transform .32s cubic-bezier(.22,1,.36,1)';
      sheet.style.transform='translateY(0)';
    }
    dy=0;
  };
  sheet.addEventListener('touchstart',e=>{ if(sheet.scrollTop<=0){startY=e.touches[0].clientY;} },{passive:true});
  sheet.addEventListener('touchmove',move,{passive:true});
  sheet.addEventListener('touchend',end);
  sheet.addEventListener('mousedown',e=>{startY=e.clientY;});
  wrap.addEventListener('mousemove',move);
  wrap.addEventListener('mouseup',end);
  wrap.addEventListener('mouseleave',end);
}
function animCloseSheet(){
  const wrap=document.getElementById('sheetWrap');
  if(!wrap){ set({theme:null}); return; }
  if(wrap.classList.contains('closing')) return;
  wrap.classList.add('closing');
  setTimeout(()=>{S.theme=null;renderSheet();},250);
}

/* =============== Router / render =============== */
let _navKey=null;
function render(){
  const home=S.tab==='lernen'&&S.screen==='faecher';
  document.body.classList.toggle('deskHome',home);
  if(home) renderDeskHome();
  let html='';
  if(S.tab==='lernen'){
    html={faecher:scrFaecher,pfad:scrPfad,videos:scrVideos,lk:scrLK,uf:scrUF}[S.screen]();
  } else if(S.tab==='community') html=scrCommunity();
  else if(S.tab==='badges') html=scrBadges();
  else if(S.tab==='streak') html=scrStreak();

  const sc=document.getElementById('screen');
  const key=S.tab+'|'+S.screen+'|'+S.fachIdx+'|'+(S.ufCase===null?'':S.ufCase);
  const navChanged=key!==_navKey;
  // finish any in-flight crossfade: keep only the newest layer
  const layers=sc.querySelectorAll('.layer');
  layers.forEach((l,i)=>{ if(i<layers.length-1) l.remove(); });
  const old=sc.querySelector('.layer');

  const layer=document.createElement('div');
  layer.className='layer';
  layer.innerHTML=html;

  if(old && !navChanged){
    // same screen re-render (quiz answer, video pick, tab within screen): swap in place, keep scroll
    const st=old.scrollTop;
    old.replaceWith(layer);
    layer.scrollTop=st;
  } else if(old){
    // navigation: crossfade — old stays visible underneath until new is fully in
    old.style.pointerEvents='none';
    sc.appendChild(layer);
    const anim=layer.animate([{opacity:0},{opacity:1}],{duration:130,easing:'ease-out'});
    anim.onfinish=()=>{ if(old.isConnected) old.remove(); };
    setTimeout(()=>{ if(old.isConnected) old.remove(); },260);
  } else {
    sc.appendChild(layer);
  }
  _navKey=key;
  renderTabbar(); renderSheet();
}

/* =============== Confetti (LK result) =============== */
function confetti(){
  const shell=document.getElementById('appShell');
  const wrap=document.createElement('div');
  wrap.style.cssText='position:absolute;inset:0;pointer-events:none;z-index:60;overflow:hidden';
  shell.appendChild(wrap);
  const colors=['#3f87e6','#77c366','#f5cf5a','#ef6f8e','#8b5fd0','#f6a13c'];
  const cx=shell.clientWidth/2, cy=shell.clientHeight*0.32;
  for(let i=0;i<22;i++){
    const d=document.createElement('div');
    const sz=6+Math.random()*7, round=Math.random()>.5;
    d.style.cssText=`position:absolute;left:${cx}px;top:${cy}px;width:${sz}px;height:${round?sz:sz*0.55}px;background:${colors[i%colors.length]};border-radius:${round?'50%':'2px'}`;
    wrap.appendChild(d);
    const ang=Math.random()*Math.PI*2, dist=90+Math.random()*150;
    const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist-110;
    d.animate([
      {transform:'translate(0,0) rotate(0) scale(1)',opacity:1},
      {transform:`translate(${dx}px,${dy+230}px) rotate(${(Math.random()*2-1)*540}deg) scale(.85)`,opacity:0}
    ],{duration:1100+Math.random()*500,easing:'cubic-bezier(.15,.6,.35,1)',fill:'forwards'});
  }
  setTimeout(()=>wrap.remove(),1800);
}

/* =============== Haptics =============== */
const hapt=(ms=8)=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

/* =============== Actions =============== */
window.App={
  goHome:()=>{hapt();set({tab:'lernen',screen:'faecher',theme:null,ufCase:null});},
  goTab:t=>{hapt();set({tab:t,theme:null});},
  comTab:t=>set({comTab:t}),
  openFach:i=>{hapt();set({tab:'lernen',screen:'pfad',fachIdx:i,theme:null});},
  backToFaecher:()=>set({screen:'faecher',theme:null}),
  openTheme:i=>{hapt();S.theme=i;renderSheet();},
  closeSheet:()=>animCloseSheet(),
  deskCard:i=>{const c=DESK_CARDS[i]; if(c.action)c.action();},
  toPfad:()=>set({screen:'pfad',theme:null,lkPicked:null}),
  toVideos:()=>set({screen:'videos',vTheme:S.theme,theme:null,vid:'0',parasOpen:false}),
  toLKFromSheet:()=>set({screen:'lk',vTheme:S.theme,theme:null,lkI:0,lkPicked:null,lkScore:0}),
  toLK:()=>set({screen:'lk',lkI:0,lkPicked:null,lkScore:0,theme:null}),
  toUF:()=>set({screen:'uf',theme:null,ufCase:null,ufText:'',ufML:false,ufKI:false}),
  pickVid:id=>set({vid:id}),
  toggleGroup:i=>{
    const key=S.fachIdx+'-'+S.vTheme;
    const o=S.vopen[key]||(S.vopen[key]={});
    const g=document.getElementById('vg'+i);
    const nowOpen=g?!g.classList.contains('open'):!o[i];
    o[i]=nowOpen;
    if(g) g.classList.toggle('open',nowOpen);
  },
  toggleParas:()=>set({parasOpen:!S.parasOpen}),
  nextVideo:()=>{
    const vt=videoTheme(), items=videoItems(vt), key=S.fachIdx+'-'+S.vTheme;
    const done={...videoDone(vt)}; done[S.vid]=true;
    const idx=items.findIndex(it=>it.id===S.vid);
    const after=items.slice(idx+1).find(it=>!done[it.id]) || items.find(it=>!done[it.id]);
    set({vmap:{...S.vmap,[key]:done},vid:after?after.id:S.vid});
  },
  lkPick:i=>{ if(S.lkPicked!==null)return; const q=LK_QS[S.lkI]; hapt(i===q.ok?10:24); set({lkPicked:i,lkScore:S.lkScore+(i===q.ok?1:0)}); },
  lkNext:()=>{const finishing=S.lkI+1>=LK_QS.length; set({lkI:S.lkI+1,lkPicked:null,lkDone:true}); if(finishing){hapt(16);setTimeout(confetti,180);} },
  lkToCase:()=>set({screen:'uf',ufCase:null,ufText:'',ufML:false,ufKI:false,lkPicked:null}),
  ufOpen:i=>set({ufCase:i,ufText:'',ufML:false,ufKI:false}),
  ufBack:()=>S.ufCase===null?set({screen:'pfad'}):set({ufCase:null,ufML:false,ufKI:false}),
  ufSetText:v=>{S.ufText=v;},
  ufSubmit:()=>set({ufML:true}),
  ufAskKI:()=>set({ufKI:true}),
  setName:v=>{S.charName=v;renderDeskHome();},
  setAvatar:a=>set({avatar:a}),
  setAvBg:c=>set({avBg:c}),
};
render();
window.addEventListener('resize',()=>{ renderTabbar(); });

/* =============== Instant touch response =============== */
(function(){
  const SEL='.press,.btn3d,.dCard,.dStat';
  let pressed=null, lastScroll=0, tapStart=0, sx=0, sy=0, tapEl=null, cancelled=false;
  // iOS only applies :active when a touchstart listener exists
  document.addEventListener('touchstart',()=>{},{passive:true});
  // know when a layer is scrolling (tap-to-stop-scroll must not trigger actions)
  document.addEventListener('scroll',()=>{lastScroll=performance.now();},{capture:true,passive:true});

  const clearPress=()=>{ if(pressed){pressed.classList.remove('pressing');pressed=null;} };
  document.addEventListener('pointerdown',e=>{
    const el=e.target.closest&&e.target.closest(SEL);
    clearPress();
    if(el){ el.classList.add('pressing'); pressed=el; }
  },{passive:true});
  document.addEventListener('pointerup',clearPress,{passive:true});
  document.addEventListener('pointercancel',clearPress,{passive:true});
  document.addEventListener('pointermove',e=>{
    if(pressed&&e.pointerType==='touch'&&(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10)) clearPress();
  },{passive:true});

  // Fast tap: fire the element's onclick on touchend instead of waiting for the click event
  document.addEventListener('touchstart',e=>{
    const t=e.touches[0]; sx=t.clientX; sy=t.clientY; tapStart=performance.now();
    cancelled = (performance.now()-lastScroll)<120 || e.touches.length>1;
    tapEl=e.target.closest&&e.target.closest('[onclick]');
    if(tapEl&&/INPUT|TEXTAREA|SELECT|A/.test(e.target.tagName)) tapEl=null;
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    const t=e.touches[0];
    if(Math.abs(t.clientX-sx)>10||Math.abs(t.clientY-sy)>10) cancelled=true;
  },{passive:true});
  document.addEventListener('touchend',e=>{
    if(!tapEl||cancelled||performance.now()-tapStart>400){tapEl=null;return;}
    const el=tapEl; tapEl=null;
    synthetic=true; el.click(); synthetic=false;   // our own click passes
    swallowUntil=performance.now()+600;            // the browser's ghost click (any target) is dropped
  },{passive:true});
  let synthetic=false, swallowUntil=0;
  document.addEventListener('click',e=>{
    if(synthetic) return;
    if(performance.now()<swallowUntil){ e.stopImmediatePropagation(); e.preventDefault(); swallowUntil=0; }
  },true);
})();

/* =============== PWA =============== */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  if (!isStandalone) showInstallChip();
});
function showInstallChip(){
  if (document.getElementById('installChip')) return;
  const chip = document.createElement('div');
  chip.id = 'installChip';
  chip.innerHTML = '📲&nbsp; Als App installieren';
  chip.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom));z-index:99;background:#1c2433;color:#fff;font-size:13px;font-weight:800;border-radius:999px;padding:11px 18px;box-shadow:0 6px 18px rgba(20,30,70,.4);cursor:pointer;display:flex;align-items:center;animation:fadeIn .3s';
  if (window.matchMedia('(min-width:768px) and (hover:hover) and (pointer:fine)').matches) chip.style.bottom = '28px';
  chip.onclick = async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') chip.remove();
    deferredPrompt = null;
  };
  document.body.appendChild(chip);
}
