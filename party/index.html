<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WLW+ · Lernplattform Steuerrecht</title>
<meta name="theme-color" content="#8fa5f0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
  :root{
    --blue:#5b74dd; --blue-dark:#4257b5; --green:#77c366; --green-dark:#57a147;
    --ink:#2a3350; --muted:#8a94b0; --bg-app:#eef1fb;
    --grad-top:#8fa5f0; --grad-bot:#7b96ec; --desk-bg:#8badf7;
  }
  *{-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--desk-bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;overflow:hidden}
  @keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .fade{animation:fadeIn .2s}
  .press{transition:transform .1s;cursor:pointer}
  .press:active{transform:scale(.97)}
  .btn3d{transition:transform .1s;cursor:pointer}
  .btn3d:active{transform:translateY(3px)}
  input,textarea{font-family:inherit}

  /* ---------- App shell (the 2a mobile app) ---------- */
  #appShell{position:relative;height:100dvh;display:flex;flex-direction:column;background:var(--bg-app);overflow:hidden}
  #screen{flex:1;overflow-y:auto;overflow-x:hidden}
  /* Desktop: app shell becomes a centered phone-like card for inner screens */
  @media (min-width:768px) and (hover:hover) and (pointer:fine){
    #appShell{width:430px;height:min(880px,calc(100vh - 48px));margin:24px auto;border-radius:34px;box-shadow:0 24px 60px rgba(30,45,110,.35);border:1px solid rgba(255,255,255,.35)}
    body.deskHome #appShell{display:none}
  }
  @media (max-width:767.98px), (hover:none), (pointer:coarse){
    #deskHome{display:none !important}
  }
  body:not(.deskHome) #deskHome{display:none}
  @media (min-width:768px) and (hover:hover) and (pointer:fine){
    body.deskHome{overflow:auto}
    body.deskHome #deskHome{display:block}
  }

  /* ---------- Tab bar ---------- */
  #tabbar{flex:none;display:flex;align-items:flex-end;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid rgba(60,80,160,.09);padding:8px 6px calc(14px + env(safe-area-inset-bottom))}
  @media (min-width:768px) and (hover:hover) and (pointer:fine){#tabbar{border-radius:0 0 33px 33px;padding-bottom:14px}}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;cursor:pointer;min-height:44px}
  .tab:active{opacity:.6}
  .tab .ic{display:flex;align-items:center;justify-content:center;height:24px}
  .tab .ic svg{width:23px;height:23px;display:block}
  .tab .lb{font-size:10.5px;font-weight:700}
  .tabRaised{flex:1;display:flex;flex-direction:column;align-items:center;cursor:pointer}
  .tabRaised .bub{width:44px;height:44px;border-radius:999px;background:linear-gradient(135deg,#8fa5f0,#5b74dd);box-shadow:0 3px 8px rgba(91,116,221,.35);display:flex;align-items:center;justify-content:center;color:#fff;margin-top:-10px;transition:transform .1s}
  .tabRaised .bub svg{width:23px;height:23px;display:block}
  .tabRaised:active .bub{transform:scale(.92)}
  .tabRaised .lb{font-size:10.5px;font-weight:800;color:var(--blue);margin-top:3px}

  /* ---------- Sticky sub-headers on gradient screens ---------- */
  .gradScreen{animation:fadeIn .2s;padding-bottom:28px;background:linear-gradient(180deg,var(--grad-top),var(--grad-bot));min-height:100%;box-sizing:border-box}
  .subHead{position:sticky;top:0;z-index:5;background:rgba(133,157,239,.93);backdrop-filter:blur(12px);padding:20px 16px 10px;border-bottom:1px solid rgba(255,255,255,.14)}
  @media (max-width:767.98px), (hover:none), (pointer:coarse){.subHead{padding-top:calc(14px + env(safe-area-inset-top))}}
  .backBtn{color:#fff;font-size:15px;font-weight:600;cursor:pointer;padding:6px 10px 6px 0}
  .backBtn:active{opacity:.5}

  /* ---------- Bottom sheet ---------- */
  #sheetWrap{position:absolute;inset:0;z-index:30}
  #sheetWrap .dim{position:absolute;inset:0;background:rgba(42,51,80,.42);animation:fadeIn .2s}
  #sheetWrap .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:10px 20px 42px;animation:sheetUp .28s cubic-bezier(.32,.72,0,1)}
  @media (min-width:768px) and (hover:hover) and (pointer:fine){#sheetWrap .sheet{border-radius:24px 24px 33px 33px}}

  /* ---------- Desktop home (screenshot layout) ---------- */
  #deskHome{min-height:100vh;padding:34px 40px 60px;box-sizing:border-box}
  .dTitle{display:flex;align-items:center;justify-content:center;gap:9px;font-size:22px;font-weight:800;color:#fff;text-shadow:0 1px 4px rgba(40,55,120,.25)}
  .dRingWrap{display:flex;justify-content:center;margin:26px 0 34px}
  .dRing{width:172px;height:172px;border-radius:999px;display:flex;align-items:center;justify-content:center}
  .dRingIn{width:148px;height:148px;border-radius:999px;background:var(--desk-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
  .dRingIn .pct{font-size:34px;font-weight:800;line-height:1}
  .dRingIn .cap{font-size:11px;font-weight:700;letter-spacing:.12em;opacity:.85;margin-top:5px}
  .dStats{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:44px}
  .dStat{background:#fff;border-radius:16px;box-shadow:0 4px 14px rgba(35,50,120,.16);padding:16px 22px;display:flex;align-items:center;gap:13px;min-width:180px;box-sizing:border-box;cursor:pointer;transition:transform .12s}
  .dStat:hover{transform:translateY(-2px)}
  .dStat:active{transform:scale(.97)}
  .dStat .ic{font-size:30px;line-height:1}
  .dStat .k{font-size:11px;font-weight:700;letter-spacing:.07em;color:#5a6478;text-transform:uppercase}
  .dStat .v{font-size:21px;font-weight:800;color:#1c2433;line-height:1.15}
  .dStat .v small{font-size:13px;font-weight:600;color:#6b7686}
  .dStatCom{background:linear-gradient(135deg,#7b6fd6,#5d4b9e);color:#fff}
  .dStatCom .k{color:rgba(255,255,255,.85)}
  .dStatCom .v{color:#fff;font-size:24px}
  .dGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:26px;max-width:1340px;margin:0 auto}
  .dCard{border-radius:20px;padding:22px 22px 26px;cursor:pointer;transition:transform .15s, box-shadow .15s;box-shadow:0 4px 14px rgba(35,50,120,.10)}
  .dCard:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(35,50,120,.22)}
  .dCard img{width:100%;aspect-ratio:248/260;object-fit:cover;border-radius:10px;display:block;box-shadow:0 2px 8px rgba(35,50,120,.18)}
  .dCard .tile{width:100%;aspect-ratio:248/260;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:84px;box-shadow:0 2px 8px rgba(35,50,120,.12)}
  .dCard h3{font-family:Georgia,'Times New Roman',serif;font-size:24px;font-weight:700;color:#1f2a44;margin:20px 0 10px;line-height:1.2}
  .dCard p{font-family:Georgia,'Times New Roman',serif;font-size:15px;color:#2c3652;margin:0;line-height:1.45}
  .dCardGhost h3,.dCardGhost p{color:#fff}

  ::-webkit-scrollbar{width:0;height:0}
</style>
</head>

/* =============== Mobile screens (2a) =============== */

    const track=f.img?'rgba(255,255,255,0.55)':'#e9edf9';
    const pctColor=started?(f.img?'#2c6b1f':GS):'#a9b2c9';
    const bar=started?(f.img?'#3e8f2d':G):'#c9d2ea';
    return `
    <div class="press" onclick="App.openFach(${i})" style="background:${cardBg};border-radius:18px;padding:15px 17px;box-shadow:0 2px 6px rgba(60,80,160,.08)">

        ${f.img?`<div style="width:52px;height:52px;flex:none;border-radius:13px;overflow:hidden;background-image:url(${f.img});background-size:cover;background-position:center"></div>`
               :`<div style="width:44px;height:44px;border-radius:13px;background:${f.tint};display:flex;align-items:center;justify-content:center;font-size:21px;flex:none">${f.icon}</div>`}
        <div style="flex:1;min-width:0;font-size:15.5px;font-weight:700;color:var(--ink)">${esc(f.name)}</div>

function scrPfad(){
  const fach=FAECHER[S.fachIdx];
  let nodeIdx=0;
  const nodes=fach.themes.map((t,i)=>{
    const off=Math.round(Math.sin(nodeIdx*1.15)*66);
    if(t.badge){
      nodeIdx++;
      const bBg=t.locked?'#dfe4f5':'linear-gradient(135deg,#f5cf5a,#e8a13a)';
      const bShadow=t.locked?'0 5px 0 #c5cde8':'0 5px 0 #b97f22';
      const bTag=t.locked?'rgba(255,255,255,.65)':'#ffe08a';
      const bFilter=t.locked?'grayscale(1) opacity(.6)':'none';
      const icon=t.bigIcon||t.icon, bSize=t.bigIcon?'15px':'24px';
      return `
      <div style="display:flex;justify-content:center;padding:12px 0 74px;transform:translateX(${off}px)">
        <div style="position:relative">
          <div style="width:56px;height:56px;transform:rotate(45deg);border-radius:17px;background:${bBg};box-shadow:${bShadow};display:flex;align-items:center;justify-content:center;margin:4px">
            <div style="transform:rotate(-45deg);font-size:${bSize};white-space:nowrap;filter:${bFilter}">${icon}</div>
          </div>
          ${t.locked?`<div style="position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:999px;background:#fff;box-shadow:0 2px 6px rgba(60,80,160,.2);display:flex;align-items:center;justify-content:center;font-size:12px">🔒</div>`:''}
          <div style="position:absolute;top:70px;left:50%;transform:translateX(-50%);text-align:center;width:200px">
            <div style="font-size:10px;font-weight:800;letter-spacing:.06em;color:${bTag};text-transform:uppercase">Badge</div>
            <div style="font-size:11.5px;font-weight:800;color:#fff">${esc(t.title)}</div>
            <div style="font-size:10.5px;color:rgba(255,255,255,.8);line-height:1.35;margin-top:2px">${esc(t.sub)}</div>
          </div>
        </div>
      </div>`;
    }
    nodeIdx++;
    const done=t.st==='done';
    const num=fach.themes.slice(0,i+1).filter(x=>!x.badge).length;
    return `
    <div style="display:flex;justify-content:center;padding:11px 0 22px;transform:translateX(${off}px)">
      <div style="position:relative">
        <div class="btn3d" onclick="App.openTheme(${i})" style="width:64px;height:64px;border-radius:999px;background:${done?G:'#fff'};box-shadow:${done?'0 5px 0 '+GS:'0 5px 0 #c9d3f0'};display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:${done?'#fff':fach.color}">${done?'✓':num}</div>
        <div style="position:absolute;top:68px;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:700;color:#fff;white-space:nowrap;text-shadow:0 1px 3px rgba(40,55,120,.25)">${esc(t.label)}</div>
      </div>
    </div>`;
  }).join('');
  const pct=fachPct(S.fachIdx);
  return `
  <div class="gradScreen">
    <div class="subHead">
      <div style="display:flex;align-items:center">
        <div class="backBtn" onclick="App.backToFaecher()">‹ Fächer</div>
        <div style="flex:1;text-align:center;font-size:15.5px;font-weight:700;color:#fff;margin-right:62px">${esc(FAECHER[S.fachIdx].name)}</div>

        <div style="width:34px;height:34px;border-radius:999px;background:${r.tint};display:flex;align-items:center;justify-content:center;font-size:16px;flex:none">${r.av}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13.5px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.name)}</div>
          <div style="font-size:10.5px;color:#8a94b0">${esc(r.title)}</div>
        </div>
        <div style="width:40px;text-align:right;font-size:12.5px;font-weight:800;color:#e05f3a;flex:none">${r.streak}</div>
        <div style="width:64px;text-align:right;font-size:12.5px;font-weight:800;color:${B};flex:none">${r.xp.toLocaleString('de-DE')}</div>
      </div>`).join('')}
    </div>`;
  } else {
    inner=`
    <div style="background:#fff;border-radius:18px;padding:18px;box-shadow:0 2px 6px rgba(60,80,160,.08);display:flex;flex-direction:column;align-items:center;margin-bottom:12px">
      <div style="width:88px;height:88px;border-radius:999px;background:${S.avBg};display:flex;align-items:center;justify-content:center;font-size:44px;border:4px solid #eef1fb">${S.avatar}</div>
      <div style="font-size:17px;font-weight:800;color:var(--ink);margin-top:10px">${esc(S.charName)}</div>
      <div style="font-size:12px;color:#8a94b0;margin-top:2px">🌱 Blutiger Anfänger</div>
      <div style="display:flex;gap:8px;margin-top:10px;background:#f5f7fd;border-radius:999px;padding:6px 14px;font-size:12px;font-weight:800"><span style="color:${B}">🎓 7393 XP</span><span style="color:#e05f3a">🔥 ${S.streak} Tage</span></div>
    </div>
    <div style="background:#fff;border-radius:18px;padding:15px 17px;box-shadow:0 2px 6px rgba(60,80,160,.08);margin-bottom:12px">
      <div style="font-size:12px;font-weight:800;color:var(--ink);margin-bottom:7px">Name</div>
      <input value="${esc(S.charName)}" oninput="App.setName(this.value)" style="width:100%;box-sizing:border-box;border:2px solid #e5e9f6;border-radius:11px;padding:10px 13px;font-size:14px;font-weight:600;color:var(--ink);outline:none;background:#fff">
    </div>
    <div style="background:#fff;border-radius:18px;padding:15px 17px;box-shadow:0 2px 6px rgba(60,80,160,.08);margin-bottom:12px">
      <div style="font-size:12px;font-weight:800;color:var(--ink);margin-bottom:9px">Avatar wählen</div>
      <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px">
        ${AVATARS.map(a=>`<div class="press" onclick="App.setAvatar('${a}')" style="aspect-ratio:1;border-radius:11px;background:#f5f7fd;border:2.5px solid ${a===S.avatar?B:'transparent'};display:flex;align-items:center;justify-content:center;font-size:20px">${a}</div>`).join('')}
      </div>
    </div>
    <div style="background:#fff;border-radius:18px;padding:15px 17px;box-shadow:0 2px 6px rgba(60,80,160,.08);margin-bottom:14px">
      <div style="font-size:12px;font-weight:800;color:var(--ink);margin-bottom:9px">Hintergrundfarbe</div>
      <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px">
        ${AV_COLORS.map(c=>`<div class="press" onclick="App.setAvBg('${c}')" style="aspect-ratio:1;border-radius:999px;background:${c};border:3px solid ${c===S.avBg?'#2a3350':'transparent'}"></div>`).join('')}
      </div>
    </div>
    <div class="press" onclick="App.goTab('community')" style="background:linear-gradient(135deg,#6d7ce6,#8b5fd0);color:#fff;border-radius:14px;padding:14px;text-align:center;font-size:15px;font-weight:800">Charakter speichern</div>`;
  }
  return `
  <div class="fade" style="padding:calc(24px + env(safe-area-inset-top)) 18px 24px">
    <div style="font-size:27px;font-weight:800;color:var(--ink);margin:8px 0 14px">Community</div>
    <div style="display:flex;background:#e2e7f7;border-radius:999px;padding:4px;margin-bottom:14px">
      <div onclick="App.comTab('rang')" style="flex:1;text-align:center;padding:9px;border-radius:999px;font-size:13px;font-weight:800;background:${rang?'#fff':'transparent'};color:${rang?B:'#8a94b0'};cursor:pointer">🏆 Rangliste</div>
      <div onclick="App.comTab('char')" style="flex:1;text-align:center;padding:9px;border-radius:999px;font-size:13px;font-weight:800;background:${!rang?'#fff':'transparent'};color:${!rang?B:'#8a94b0'};cursor:pointer">😊 Mein Charakter</div>
    </div>
    ${inner}
  </div>`;
}

function scrBadges(){
  return `
  <div class="fade" style="padding:calc(24px + env(safe-area-inset-top)) 18px 24px">
    <div style="font-size:27px;font-weight:800;color:var(--ink);margin:8px 0 20px">Badges</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:11px">
      ${BADGES.map(b=>`
      <div style="position:relative;background:${b.earned?'#fdf8e8':'#fff'};border:2px solid ${b.earned?'#ecc94b':'transparent'};border-radius:16px;padding:22px 12px 14px;text-align:center;box-shadow:0 2px 6px rgba(60,80,160,.08)">
        <div style="position:absolute;top:9px;right:9px;width:26px;height:26px;border-radius:999px;background:${b.earned?'#57a147':'#e8ebf4'};display:flex;align-items:center;justify-content:center;font-size:12px">${b.earned?'🔓':'🔒'}</div>
        <div style="font-size:34px;filter:${b.earned?'none':'grayscale(1) opacity(.55)'};letter-spacing:2px;white-space:nowrap">${b.icon}</div>
        <div style="font-size:12px;font-weight:800;color:${b.earned?'var(--ink)':'#8a94b0'};margin-top:9px;line-height:1.3">${esc(b.name)}</div>
        <div style="font-size:10px;color:#8a94b0;line-height:1.4;margin-top:4px">${esc(b.sub)}</div>
        <div style="font-size:9.5px;font-weight:700;color:${b.earned?GS:'#b3bccf'};margin-top:7px">${b.earned?'✓ Freigeschaltet am '+b.date:'Noch nicht freigeschaltet'}</div>
      </div>`).join('')}
    </div>
  </div>`;
}

function scrStreak(){
  const rows=[['1 Tag','50 XP',0],['4 Tage','400 XP',1],['10 Tage','1000 XP',0],['50 Tage','5000 XP',0],['100 Tage','10000 XP',0]];
  return `
  <div class="fade" style="padding:calc(24px + env(safe-area-inset-top)) 18px 24px">
    <div style="font-size:27px;font-weight:800;color:var(--ink);margin:8px 0 14px">Streak</div>
    <div style="background:linear-gradient(150deg,#f6a13c,#e8862a);border-radius:22px;padding:24px;text-align:center;color:#fff;box-shadow:0 6px 18px rgba(232,134,42,.35);margin-bottom:12px">
      <div style="font-size:52px;line-height:1">🔥</div>
      <div style="font-size:42px;font-weight:800;line-height:1;margin-top:8px">${S.streak}</div>
      <div style="font-size:14px;font-weight:700;opacity:.9;margin-top:4px">Tage in Folge</div>
      <div style="display:inline-block;background:rgba(255,255,255,.2);border-radius:999px;padding:5px 14px;font-size:12px;font-weight:800;margin-top:12px">🏆 Rekord: 4 Tage</div>
    </div>
    <div style="background:#fff;border-radius:18px;padding:17px;box-shadow:0 2px 6px rgba(60,80,160,.08);margin-bottom:12px">
      <div style="font-size:13.5px;color:#4a5568;line-height:1.55">Die aktuelle Streak zeigt an, wie viele Tage in Folge du gelernt hast.</div>
      <div style="font-size:13.5px;font-weight:800;color:var(--ink);margin-top:8px">Bleib am Ball, um mehr XP zu verdienen!</div>
    </div>
    <div style="background:#fff;border-radius:18px;box-shadow:0 2px 6px rgba(60,80,160,.08);overflow:hidden">
      ${rows.map(([d,xp,hl],i)=>`<div style="display:flex;align-items:center;gap:12px;padding:13px 17px;${i<rows.length-1?'border-bottom:1px solid #f0f3fb;':''}${hl?'background:#fdf3e6;':''}"><div style="font-size:17px">🔥</div><div style="flex:1;font-size:14px;font-weight:700;color:var(--ink)">${d}</div><div style="font-size:13.5px;font-weight:800;color:${B}">${xp}</div></div>`).join('')}
    </div>
  </div>`;
}

/* =============== Tab bar + bottom sheet =============== */
const TAB_ICONS={
  home:(f)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.8 12 3l9 7.8"/><path d="M5.4 9.5V20a1 1 0 0 0 1 1h3.8v-5.4a1.8 1.8 0 0 1 3.6 0V21h3.8a1 1 0 0 0 1-1V9.5"/></svg>`,
  community:(f)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.8 20c.5-3.4 3-5.4 6.2-5.4s5.7 2 6.2 5.4"/><path d="M15.4 5.2a3.2 3.2 0 0 1 0 5.6"/><path d="M17.6 14.9c2 .7 3.3 2.4 3.6 5.1"/></svg>`,
  lernen:(f)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5.5C10.3 4.2 8 3.6 4.5 3.6c-.6 0-1 .4-1 1v13.2c0 .6.4 1 1 1 3.5 0 5.8.6 7.5 1.9 1.7-1.3 4-1.9 7.5-1.9.6 0 1-.4 1-1V4.6c0-.6-.4-1-1-1-3.5 0-5.8.6-7.5 1.9Z"/><path d="M12 5.5v15.2"/></svg>`,
  badges:(f)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="5.2"/><path d="m8.8 13.3-2 7.1 5.2-2.6 5.2 2.6-2-7.1"/><path d="m12 6.6.9 1.8 2 .3-1.45 1.4.35 2-1.8-.95-1.8.95.35-2L9.1 8.7l2-.3.9-1.8Z" fill="currentColor" stroke="none"/></svg>`,
  streak:(f)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21.5c3.9 0 6.5-2.5 6.5-6.2 0-2.6-1.4-4.6-2.9-6.4-.3 1-.9 1.9-1.8 2.5.2-3-1-6.3-3.8-8.4.1 2.6-1.1 4.4-2.6 6.1-1.4 1.7-2.9 3.5-2.9 6.2 0 3.7 2.6 6.2 6.5 6.2Z"/><path d="M12 21.5c1.8 0 3-1.2 3-3 0-1.4-.9-2.3-1.7-3.3-.9 1-2 1.3-2.7 2.4-.4.5-.6 1-.6 1.6 0 1.4 1 2.3 2 2.3Z" fill="currentColor" stroke="none" opacity=".35"/></svg>`,
};
function renderTabbar(){
  const defs=[
    { id:'home', label:'Home' },
    { id:'community', label:'Community' },
    { id:'lernen', label:'Lernen', raised:true },
    { id:'badges', label:'Badges' },
    { id:'streak', label:'Streak' },
  ];
  document.getElementById('tabbar').innerHTML=defs.map(t=>{
    if(t.raised) return `<div class="tabRaised" onclick="App.goHome()"><div class="bub">${TAB_ICONS.lernen()}</div><div class="lb">${t.label}</div></div>`;
    const active=t.id==='home'?(S.tab==='lernen'&&S.screen==='faecher'):S.tab===t.id;
    const col=active?B:'#a9b2c9';
    return `<div class="tab" onclick="${t.id==='home'?'App.goHome()':`App.goTab('${t.id}')`}">
      <div class="ic" style="color:${col}">${TAB_ICONS[t.id]()}</div>
      <div class="lb" style="color:${active?B:'#8a94b0'}">${t.label}</div></div>`;
  }).join('');
}
function renderSheet(){
  const host=document.getElementById('sheetHost');
  if(S.theme===null){host.innerHTML='';return;}
  const fach=FAECHER[S.fachIdx];
  const t=fach.themes[S.theme];
  const num=fach.themes.slice(0,S.theme+1).filter(x=>!x.badge).length;
  const states=t.st==='done'?['done','done','done']
    :(S.fachIdx===0&&t.st==='current'&&S.lkDone)?['done','done','open']
    :t.st==='current'?['done','open','open']:['open','open','open'];
  const units=[
    { name:'Lernvideos', icon:'🎬', tap:'App.toVideos()' },
    { name:'Lernkontrolle', icon:'📝', tap:'App.toLKFromSheet()' },
    { name:'Übungsfall', icon:'⚖️', tap:'App.toUF()' },
  ];
  host.innerHTML=`
  <div id="sheetWrap">
    <div class="dim" onclick="App.closeSheet()"></div>
    <div class="sheet">
      <div style="width:38px;height:5px;border-radius:3px;background:#dde3f5;margin:0 auto 14px"></div>
      <div style="font-size:11.5px;font-weight:800;letter-spacing:.06em;color:${B};text-transform:uppercase">Thema ${num}</div>
      <div style="font-size:19px;font-weight:800;color:var(--ink);margin:4px 0 16px;line-height:1.3">${esc(t.t)}</div>
      <div style="display:flex;flex-direction:column;gap:9px">
        ${units.map((u,i)=>{
          const st=states[i];
          return `<div class="press" onclick="${u.tap}" style="display:flex;align-items:center;gap:13px;border:2px solid ${st==='done'?'#cfe9c8':'#e5e9f6'};background:${st==='done'?'#eef8ea':'#fff'};border-radius:15px;padding:13px 15px">
            <div style="font-size:20px;flex:none">${u.icon}</div>
            <div style="flex:1;font-size:14.5px;font-weight:700;color:var(--ink)">${u.name}</div>
            <div style="font-size:13px;font-weight:800;color:${st==='done'?GS:B};flex:none">${st==='done'?'✓':'›'}</div>
          </div>`;}).join('')}
      </div>
    </div>
  </div>`;
}

/* =============== Router / render =============== */
function render(){
  const home=S.tab==='lernen'&&S.screen==='faecher';
  document.body.classList.toggle('deskHome',home);
  if(home) renderDeskHome();
  let html='';
  if(S.tab==='lernen'){
    html={faecher:scrFaecher,pfad:scrPfad,videos:scrVideos,lk:scrLK,uf:scrUF}[S.screen]();
  } else if(S.tab==='community') html=scrCommunity();
  else if(S.tab==='badges') html=scrBadges();
  else if(S.tab==='streak') html=scrStreak();
  const sc=document.getElementById('screen');
  sc.innerHTML=html; sc.scrollTop=0;
  renderTabbar(); renderSheet();
}

/* =============== Actions =============== */
window.App={
  goHome:()=>set({tab:'lernen',screen:'faecher',theme:null,ufCase:null}),
  goTab:t=>set({tab:t,theme:null}),
  comTab:t=>set({comTab:t}),
  openFach:i=>set({tab:'lernen',screen:'pfad',fachIdx:i,theme:null}),
  backToFaecher:()=>set({screen:'faecher',theme:null}),
  openTheme:i=>set({theme:i}),
  closeSheet:()=>set({theme:null}),
  deskCard:i=>{const c=DESK_CARDS[i]; if(c.action)c.action();},
  toPfad:()=>set({screen:'pfad',theme:null,lkPicked:null}),
  toVideos:()=>set({screen:'videos',vTheme:S.theme,theme:null,vid:0,parasOpen:false}),
  toLKFromSheet:()=>set({screen:'lk',vTheme:S.theme,theme:null,lkI:0,lkPicked:null,lkScore:0}),
  toLK:()=>set({screen:'lk',lkI:0,lkPicked:null,lkScore:0,theme:null}),
  toUF:()=>set({screen:'uf',theme:null,ufCase:null,ufText:'',ufML:false,ufKI:false}),
  pickVid:i=>set({vid:i}),
  toggleParas:()=>set({parasOpen:!S.parasOpen}),
  nextVideo:()=>{
    const fach=FAECHER[S.fachIdx], vt=fach.themes[S.vTheme]||fach.themes[0];
    const list=vt.vids||['Einführung ins Thema','Grundbegriffe & Definitionen','Vertiefung & Beispiele'];
    const key=S.fachIdx+'-'+S.vTheme;
    const done=(S.vmap[key]||list.map((x,i)=>vt.st==='done'?true:(vt.vinit||[])[i]||false)).slice();
    done[S.vid]=true;
    const next=done.findIndex(d=>!d);
    set({vmap:{...S.vmap,[key]:done},vid:next===-1?S.vid:next});
  },
  lkPick:i=>{ if(S.lkPicked!==null)return; const q=LK_QS[S.lkI]; set({lkPicked:i,lkScore:S.lkScore+(i===q.ok?1:0)}); },
  lkNext:()=>set({lkI:S.lkI+1,lkPicked:null,lkDone:true}),
  lkToCase:()=>set({screen:'uf',ufCase:null,ufText:'',ufML:false,ufKI:false,lkPicked:null}),
  ufOpen:i=>set({ufCase:i,ufText:'',ufML:false,ufKI:false}),
  ufBack:()=>S.ufCase===null?set({screen:'pfad'}):set({ufCase:null,ufML:false,ufKI:false}),
  ufSetText:v=>{S.ufText=v;},
  ufSubmit:()=>set({ufML:true}),
  ufAskKI:()=>set({ufKI:true}),
  setName:v=>{S.charName=v;renderDeskHome();},
  setAvatar:a=>set({avatar:a}),
  setAvBg:c=>set({avBg:c}),
};
render();
window.addEventListener('resize',()=>{ /* re-evaluate desktop/mobile home split */ });

/* =============== PWA =============== */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  if (!isStandalone) showInstallChip();
});
function showInstallChip(){
  if (document.getElementById('installChip')) return;
  const chip = document.createElement('div');
  chip.id = 'installChip';
  chip.innerHTML = '📲&nbsp; Als App installieren';
  chip.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));z-index:99;background:#1c2433;color:#fff;font-size:13px;font-weight:800;border-radius:999px;padding:11px 18px;box-shadow:0 6px 18px rgba(20,30,70,.4);cursor:pointer;display:flex;align-items:center;animation:fadeIn .3s';
  if (window.matchMedia('(min-width:768px) and (hover:hover) and (pointer:fine)').matches) chip.style.bottom = '28px';
  chip.onclick = async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') chip.remove();
    deferredPrompt = null;
  };
  document.body.appendChild(chip);
}
</script>
</body>
</html>
